<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilates - Preferências</title>

    <script src="js/sessao.js"></script>
    
    <link rel="icon" href="assets/icons/icone.png">
    <link rel="stylesheet" href="css/institucional.css">
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body onload="validarSessao()">

    <div class="form">

        <h1>Cadastre suas preferências</h1>
        <p>Preencha para personalizar sua experiência.</p>

        <div class="campo">
            <p>Gênero musical</p>
            <select name="" id="ipt_genero_musical">
                <option value="">Selecione...</option>
                <option value="Pop">Pop</option>
                <option value="Rock">Rock</option>
                <option value="Hip Hop">Hip Hop</option>
                <option value="Sertanejo">Sertanejo</option>
                <option value="Funk">Funk</option>
                <option value="Reggae">Reggae</option>
                <option value="MPB">MPB</option>
            </select> 
        </div>
        
        <div class="campo">
            <p>Objetivo com o Pilates</p>
            <select name="" id="ipt_objetivo_pilates">
                <option value="">Selecione...</option>
                <option value="Postura">Melhorar a postura</option>
                <option value="Flexibilidade">Ganhar flexibilidade</option>
                <option value="Fortalecimento">Fortalecer o corpo</option>
                <option value="Reabilitação">Reabilitação de lesões</option>
                <option value="Qualidade de Vida">Melhorar a qualidade de vida</option>
            </select>
        </div>

        <div class="campo">
            <p>Quando você começou a praticar Pilates?</p>
            <input type="text" id="ipt_tempo_treino" placeholder="Digite a data de início (DD/MM/AAAA)">
        </div>

        <div class="campo">
            <button onclick="cadastrarPreferencias()">Salvar Preferências</button>
        </div>

        <div class="erro" id="cardErro" style="display: none; color: red; margin-top: 10px;">
            <p id="mensagem_erro"></p>
        </div>

    </div>

    
</body>
</html>

<script>

    function cadastrarPreferencias()
    {
        // aguardar();

        var generoMusicalVar = ipt_genero_musical.value;
        var objetivoPilatesVar = ipt_objetivo_pilates.value;
        var dataBruta = ipt_tempo_treino.value;

        var dia = dataBruta[0] + dataBruta[1];
        var mes = dataBruta[3] + dataBruta[4];
        var ano = dataBruta[6] + dataBruta[7] + dataBruta[8] + dataBruta[9]

        var tempoTreinoVar = ano + `-` + mes + `-` + dia;

        var fkUsuario = sessionStorage.ID_USUARIO;

        /*
        // Verificando se há algum campo em branco
        if (
            nomeVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(Mensagem de erro para todos os campos em branco)";

            finalizarAguardar();
            return false;
        } else {
            //setInterval(sumirMensagem, 5000);
        }*/
        /*
        if (nomeVar.length < 1 ||
            (!emailVar.includes("@") || !emailVar.includes(".")) ||
            senhaVar.length < 6 ||
            confirmacaoSenhaVar != senhaVar)
        {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "(Mensagem de erro para campos não preenchidos corretamente)";

            //finalizarAguardar();
            return false;
        }

        else
        {
            //setInterval(sumirMensagem, 5000);
        }*/

        // Enviando o valor da nova input
        fetch("/preferencia/cadastrar-preferencias",
        {
            method: "POST",
            headers:
            {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                generoMusicalServer: generoMusicalVar,
                objetivoPilatesServer: objetivoPilatesVar,
                tempoTreinoServer: tempoTreinoVar,
                fkUsuarioServer: fkUsuario
            }),
        })
            .then(function (resposta)
            {
                console.log("resposta: ", resposta);

                if (resposta.ok)
                {
                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "inicio.html";
                    }, "2000");

                    //limparFormulario();
                    //finalizarAguardar();
                }
                
                else
                {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta)
            {
                console.log(`#ERRO: ${resposta}`);
                //finalizarAguardar();
            });

        return false;
    }


</script>
