<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilates - Quiz</title>

    <script src="js/sessao.js"></script>

    <link rel="icon" href="assets/icons/icone.png">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/institucional.css">
</head>
<body onload="validarSessao()">

    <header>

        <p><a href="inicio.html">← Voltar</a></p>
        
    </header>

    <div class="form" id="form">

        <h1>Iniciar Quiz</h1>

        <p id="id-orientacao">Clique no botão abaixo para iniciar sua tentativa:</p>

        <div class="campo">
            <button onclick="iniciarQuiz()">Iniciar Quiz</button>
        </div>

    </div>

    <div class="form escondido" id="resultado">

        <h1>Parabéns pela sua tentativa!</h1>

        <div class="resultado">
            <span>Quantidade de acertos: <span id="spanCertas"></span></span>
            <span>Quantidade de erros: <span id="spanErradas"></span></span>
            <span id="pontuacaoFinal">Pontuação Final: <span id="spanPontuacaoFinal">-</span></span>
            <span id="msgFinal">-</span>  
        </div>

    </div>

    <div class="perguntas escondido" id="perguntas">

        <span>Questão atual: <span id="spanNumeroDaQuestao_atual"></span> de <span id="qtdQuestoes"></span> questões.</span>

        <h1>Responda a questão</h1>

        <div class="pergunta">
            <div class="enunciado" id="enunciado">-</div>
            
            <div class="alternativas" id="alternativas">
                <input type="radio" name="opcao" id="alternativa_a" value="alternativa_a">
                <label for="alternativa_a" id="opcao_a">-</label> <br>

                <input type="radio" name="opcao" id="alternativa_b" value="alternativa_b">
                <label for="alternativa_b" id="opcao_b">-</label> <br>

                <input type="radio" name="opcao" id="alternativa_c" value="alternativa_c">
                <label for="alternativa_c" id="opcao_c">-</label> <br>

                <input type="radio" name="opcao" id="alternativa_d" value="alternativa_d">
                <label for="alternativa_d" id="opcao_d">-</label>
            </div>
        </div>
        
        <div class="campo">
            <div class="navegacao-quiz">
                <button onclick="submeter()" id="btnSubmeter">Verificar resposta</button>
                <button onclick="avancar()" id="btnProx" disabled>Próxima pergunta</button>
            </div>
            <button onclick="tentarNovamente()" id="btnTentarNovamente" class="escondido" disabled>Tentar novamente</button>
        </div>

    </div>
    
</body>
</html>

<script>

    // Questões do quiz
    // cada objeto representa uma questão com alternativas e resposta correta
    let questoes = [
        // 1
        {
            pergunta: '1. Quem criou o método Pilates?',
            alt_a: 'Pehr Henrik',
            alt_b: 'Brian Mulligan',
            alt_c: 'Joseph Hubertus',
            alt_d: 'Robin McKenzie',
            alt_correta: 'alternativa_c'
        },
        // 2
        {
            pergunta: '2. O Pilates é conhecido por unir principalmente:',
            alt_a: 'Força e velocidade',
            alt_b: 'Mente e corpo',
            alt_c: 'Competição e resistência',
            alt_d: 'Carga e impacto',
            alt_correta: 'alternativa_b'
        },
        // 3
        {
            pergunta: '3. Qual destes públicos pode praticar Pilates?',
            alt_a: 'Somente atletas',
            alt_b: 'Apenas idosos',
            alt_c: 'Somente pessoas lesionadas',
            alt_d: 'Pessoas de diferentes idades',
            alt_correta: 'alternativa_d'
        },
        // 4
        {
            pergunta: '4. Qual dos benefícios abaixo está associado à prática regular de Pilates?',
            alt_a: 'Melhora da postura e estabilidade corporal',
            alt_b: 'Perda instantânea de gordura',
            alt_c: 'Aumento exclusivo da força dos braços',
            alt_d: 'Substituição total de exercícios cardiovasculares',
            alt_correta: 'alternativa_a'
        },
        // 5
        {
            pergunta: '5. Qual benefício emocional pode estar associado à prática de Pilates?',
            alt_a: 'Aumento do estresse',
            alt_b: 'Melhora da concentração',
            alt_c: 'Fadiga constante',
            alt_d: 'Perda de coordenação',
            alt_correta: 'alternativa_b'
        },
        // 6
        {
            pergunta: '6. Qual modalidade de Pilates é realizada apenas com o peso do próprio corpo, sem uso de aparelhos?',
            alt_a: 'Pilates no Reformer',
            alt_b: 'Pilates Clínico',
            alt_c: 'Pilates Mat',
            alt_d: 'Pilates Aéreo',
            alt_correta: 'alternativa_c'
        },
        // 7
        {
            pergunta: '7. Qual dos aparelhos abaixo NÃO é destinado para a prática de Pilates?',
            alt_a: 'Cadillac',
            alt_b: 'Smith',
            alt_c: 'Reformer',
            alt_d: 'Chair',
            alt_correta: 'alternativa_b'
        },
        // 8
        {
            pergunta: '8. Qual era o nome original que Joseph Pilates deu ao seu método?',
            alt_a: 'Bodyflow',
            alt_b: 'Contrology',
            alt_c: 'Core Training',
            alt_d: 'Kinesis',
            alt_correta: 'alternativa_b'
        },
        // 9
        {
            pergunta: '9. Em qual cidade os primeiros estúdios de Pilates se popularizaram, atraindo bailarinos e artistas?',
            alt_a: 'Nova York',
            alt_b: 'Los Angeles',
            alt_c: 'Londres',
            alt_d: 'Berlim',
            alt_correta: 'alternativa_a'
        },
        // 10
        {
            pergunta: '10. Para qual grupo Joseph Pilates desenvolveu originalmente seu método durante a Primeira Guerra Mundial?',
            alt_a: 'Soldados do exército alemão em campo de batalha',
            alt_b: 'Atletas olímpicos dos jogos de 1916',
            alt_c: 'Bailarinos da Ópera de Berlim',
            alt_d: 'Internos de um campo de detenção na ilha de Man, na Inglaterra',
            alt_correta: 'alternativa_d'
        }
    ]

    // Variáveis globais
    let numero_da_questao_atual = 0;
    let pontuacao_final = 0;
    let certas = 0;
    let erradas = 0;
    let qtd_questoes = questoes.length;

    function iniciarQuiz()
    {
        // esconde tela inicial e mostra perguntas
        document.getElementById('form').classList.add('escondido');
        document.getElementById('perguntas').classList.remove('escondido');

        // mostra quantidade total de questões
        document.getElementById('qtdQuestoes').innerHTML = qtd_questoes

        // carrega primeira questão
        preencherHTMLcomQuestao_atual(0);

        // controla botões iniciais
        btnSubmeter.disabled = false;
        btnProx.disabled = true;
        btnTentarNovamente.disabled = true;
    }

    function preencherHTMLcomQuestao_atual(index)
    {
        habilitarAlternativas(true); // libera alternativas

        const questao_atual = questoes[index]; // pega questão atual
        numero_da_questao_atual = index; // atualiza o indice

        console.log("questao_atual")
        console.log(questao_atual)

         // mostra número da questão (index começa em 0)
        document.getElementById("spanNumeroDaQuestao_atual").innerHTML = Number(index) + 1;

        document.getElementById("enunciado").innerHTML = questao_atual.pergunta;
        document.getElementById("opcao_a").innerHTML = questao_atual.alt_a;
        document.getElementById("opcao_b").innerHTML = questao_atual.alt_b;
        document.getElementById("opcao_c").innerHTML = questao_atual.alt_c;
        document.getElementById("opcao_d").innerHTML = questao_atual.alt_d;
    }

    function submeter()
    {
        const opcoes = document.getElementsByName("opcao"); // pega radios (alternativas)
        let alternativa_selecionada = false;
        
        // verifica se alguma alternativa foi marcada
        for (let i = 0; i < opcoes.length; i++)
        {
            if (opcoes[i].checked)
            {
                alternativa_selecionada = true;
                break;
            }
        }

        if (!alternativa_selecionada)
        {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        }

        else
        {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false) // bloqueia mudança
            checarResposta() // valida resposta
        }
    }

    function habilitarAlternativas(trueOrFalse)
    {
        let opcao_escolhida = trueOrFalse ? false : true

        // controla enable/disable dos radios

        alternativa_a.disabled = opcao_escolhida;
        alternativa_b.disabled = opcao_escolhida;
        alternativa_c.disabled = opcao_escolhida;
        alternativa_d.disabled = opcao_escolhida;
    }

    function avancar() 
    {
        // controla fluxo do quiz e avanço de questões

        btnProx.disabled = true
        btnSubmeter.disabled = false

        desmarcarRadioButtons()

        if (numero_da_questao_atual < qtd_questoes - 1)
        {
            preencherHTMLcomQuestao_atual(numero_da_questao_atual)
        }
        
        else if (numero_da_questao_atual == qtd_questoes - 1)
        {
            alert("Atenção... a próxima é a ultima questão!")
            preencherHTMLcomQuestao_atual(numero_da_questao_atual)
        }
        
        else
        {
            finalizarJogo() // fim do quiz
        }

        limparCoresBackgroundOpcoes()
    }

    function tentarNovamente()
    {
        // atualiza a página
        window.location.reload();
    }

    function checarResposta()
    {
        const questao_atual = questoes[numero_da_questao_atual] // questão atual 
        const resposta_questao_atual = questao_atual.alt_correta; // qual é a resposta correta da questão atual

        const opcoes = document.getElementsByName("opcao"); // recupera alternativas no html

        let alternativa_correta = null // variável para armazenar a alternativa correta

        // encontra qual label corresponde à correta
        opcoes.forEach((option) => {
            if (option.value === resposta_questao_atual)
            {
                console.log("alternativa_correta está no componente: " + alternativa_correta)

                alternativa_correta = option.labels[0].id
            }
        })

        // verifica se resposta assinalada é correta
        opcoes.forEach((option) => {
            if (option.checked === true && option.value === resposta_questao_atual)
            {
                document.getElementById(alternativa_correta).classList.add("pergunta_certa")

                pontuacao_final += 10;
                certas++
                numero_da_questao_atual++
            }
            
            else if (option.checked && option.value !== resposta_questao_atual)
            {
                const wrongLabelId = option.labels[0].id

                document.getElementById(wrongLabelId).classList.add("pergunta_errada")
                document.getElementById(alternativa_correta).classList.add("pergunta_certa")
                erradas++
                numero_da_questao_atual++
            }
        })
    }

    function limparCoresBackgroundOpcoes()
    {
        const opcoes = document.getElementsByName("opcao");
        opcoes.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("pergunta_errada")
            document.getElementById(option.labels[0].id).classList.remove("pergunta_certa")
        })
    }

    function desmarcarRadioButtons()
    {
        const opcoes = document.getElementsByName("opcao");

        for (let i = 0; i < opcoes.length; i++)
        {
            opcoes[i].checked = false;
        }
    }

    function finalizarJogo()
    {
        // calcula resultado final e envia pro backend
        let textoParaMensagemFinal = null
        const porcentagemFinalDeAcertos = (certas / qtd_questoes) * 100;

        if (porcentagemFinalDeAcertos <= 30) {
            textoParaMensagemFinal = "<br>Parece que você não estudou..."
        }
        else if (porcentagemFinalDeAcertos > 30 && porcentagemFinalDeAcertos < 60)
        {
            textoParaMensagemFinal = "<br>Pode melhorar na próxima, hein!"
        }
        else if (porcentagemFinalDeAcertos >= 60) {
            textoParaMensagemFinal = "<br>Uau, parabéns!"
        }


        document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal

        document.getElementById('btnSubmeter').classList.add('escondido') 
        document.getElementById('btnProx').classList.add('escondido') 
        document.getElementById('btnTentarNovamente').classList.remove('escondido') 

        document.getElementById('perguntas').classList.add('escondido') 
    
        document.getElementById('resultado').classList.remove('escondido') 

        spanCertas.innerHTML = `<b>${certas}</b>`;
        spanErradas.innerHTML = `<b>${erradas}</b>`;
        spanPontuacaoFinal.innerHTML = `<b>${pontuacao_final}</b>pts de um máximo de 100pts`;

        realizarQuiz(pontuacao_final); // salva no banco
    }

    function realizarQuiz(pontuacao)
    {
        // envia resultado pro backend via fetch
        var pontuacaoFinalVar = pontuacao;
        var fkUsuario = sessionStorage.ID_USUARIO;

        // Faz a requisição
        // quando o servidor responder
        // verifica se deu ok
        // converte o conteúdo
        // usa os dados
        // se qualquer coisa der errado no caminho -> cai no catch
        fetch("/quiz/realizar-quiz/",
        {
            method: "POST",
            headers:
            {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                pontuacaoQuizServer: pontuacaoFinalVar,
                fkUsuarioServer: fkUsuario
            }),
        })
            .then(function (resposta)
            {
                console.log("resposta: ", resposta);

                if (resposta.ok)
                {
                    
                }
                
                else
                {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta)
            {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

</script>
