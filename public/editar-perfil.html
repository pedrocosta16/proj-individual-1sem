<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilates - Editar Perfil</title>

    <script src="js/sessao.js"></script>

    <link rel="icon" href="assets/icons/icone.png">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body onload="visualizarUsuario(), visualizarPreferencias()">

    <header>

        <p><a href="inicio.html">← Voltar</a></p>
        
    </header>

    <div class="form">

        <h1>Editar Perfil</h1>

        <div class="campo">
            <p>Nome Completo:</p>
            <input type="text" id="ipt_nome_user" placeholder="Digite seu nome">
        </div>
        
        <div class="campo">
            <p>Data de Nascimento:</p>
            <input type="text" id="ipt_nascimento_user" placeholder="Digite a data de nascimento (DD/MM/AAAA)">
        </div>

        <div class="campo">
            <p>Email:</p>
            <input type="email" id="ipt_email_user" placeholder="Digite seu email">
        </div>

        <div class="campo">
            <p>Senha:</p>
            <div id="div_olho" class="div_olho">
                <input type="password" id="ipt_senha_user" placeholder="Digite sua senha">
                <img id="olho" onclick="verSenha()" class="olho-visivel" src="assets/icons/not-visible.png" alt="">
            </div>
        </div>

        <div class="campo"> 
            <p>Confirme a senha:</p>
            <input type="password" id="ipt_conf_senha_user" placeholder="Digite sua senha novamente">
        </div>

        <div class="campo">
            <button onclick="atualizarUsuario()">Atualizar Dados</button>
        </div>

    </div>

    <div class="form">

        <h1>Editar Preferências</h1>

        <div class="campo">
            <p>Gênero musical</p>
            <select name="" id="ipt_genero_musical">
                <option value="">Selecione...</option>
                <option value="Pop">Pop</option>
                <option value="Rock">Rock</option>
                <option value="Hip Hop">Hip Hop</option>
                <option value="Sertanejo">Sertanejo</option>
                <option value="Funk">Funk</option>
                <option value="Reggae">Reggae</option>
                <option value="MPB">MPB</option>
            </select>
        </div>
        
        <div class="campo">
            <p>Objetivo com o Pilates</p>
            <select name="" id="ipt_objetivo_pilates">
                <option value="">Selecione...</option>
                <option value="Postura">Melhorar a postura</option>
                <option value="Flexibilidade">Ganhar flexibilidade</option>
                <option value="Fortalecimento">Fortalecer o corpo</option>
                <option value="Reabilitação">Reabilitação de lesões</option>
                <option value="Qualidade de Vida">Melhorar a qualidade de vida</option>
            </select>
        </div>

        <div class="campo">
            <p>Quando você começou a praticar Pilates?</p>
            <input type="text" id="ipt_tempo_treino" placeholder="Digite a data de início (DD/MM/AAAA)">
        </div>

        <div class="campo">
            <button onclick="atualizarPreferencias()">Atualizar Dados</button>
        </div>

        <div class="erro" id="cardErro" style="display: none; color: red; margin-top: 10px;">
            <p id="mensagem_erro"></p>
        </div>

    </div>
    
</body>
</html>

<script>
    
    function visualizarUsuario()
    {
        // função que busca os dados do user logado no backend e preenche o form

        // recupera o id do usuário armazenado na sessão (login)
        var fkUsuario = sessionStorage.ID_USUARIO;

        // requisição GET para buscar dados do usuário pelo id

        // Faz a requisição
        // quando o servidor responder
        // verifica se deu ok
        // converte o JSON
        // usa os dados
        // Se qualquer coisa der errado no caminho
        // cai no catch
        fetch(`/usuario/visualizar-usuario/${fkUsuario}`) 

        // trata a resposta do servidor
        .then(function (resposta)
        {
            if (resposta.ok)
            {
                resposta.json().then(function (dados)
                {
                    document.getElementById("ipt_nome_user").value = dados[0].nome_usuario;
                    document.getElementById("ipt_nascimento_user").value = dados[0].dt_nasc_usuario;
                    document.getElementById("ipt_email_user").value = dados[0].email_usuario;
                    document.getElementById("ipt_senha_user").value = dados[0].senha_usuario;
                    document.getElementById("ipt_conf_senha_user").value = dados[0].senha_usuario;
                });
            }
        });
    }

    function atualizarUsuario()
    {
        // função responsável por validar e atualizar dados do usuário no backend

        // id do usuário logado
        var fkUsuario = sessionStorage.ID_USUARIO;

        var nomeVar = ipt_nome_user.value;
        var dataBruta = ipt_nascimento_user.value;

        var dia = dataBruta[0] + dataBruta[1];
        var mes = dataBruta[3] + dataBruta[4];
        var ano = dataBruta[6] + dataBruta[7] + dataBruta[8] + dataBruta[9]

        var nascimentoVar = ano + `-` + mes + `-` + dia;

        var emailVar = ipt_email_user.value;
        var senhaVar = ipt_senha_user.value;
        var confirmacaoSenhaVar = ipt_conf_senha_user.value;

        console.log(nomeVar, emailVar, senhaVar, confirmacaoSenhaVar);

        if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "")
        {
            alert(`Verifique campos em branco`);
            return false;
        }

        else if (nomeVar.length < 3)
        {
            alert(`Seu nome deve ter mais de 1 caractere`);
            return false;
        }

        else if (!dataBruta.includes('/'))
        {
            alert(`Certifique-se que sua data de nascimento está seguindo esse formato: DD/MM/AAAA`);
            return false;
        }

        else if (!emailVar.includes("@") || !emailVar.includes(".com"))
        {
            alert(`Certifique-se que seu e-mail contenha "@" e ".com"`);
            return false;
        }

        else if (senhaVar.length < 5)
        {
            alert(`Sua senha deve conter mais de 5 caracteres`);
            return false;
        }

        else if (confirmacaoSenhaVar != senhaVar)
        {
            alert(`Sua senha não está igual`)
            return false;
        }

        else
        {
            // envia dados atualizados para o backend

            // Faz a requisição
            // quando o servidor responder
            // verifica se deu ok
            // converte o conteúdo
            // usa os dados
            // se qualquer coisa der errado no caminho -> cai no catch
            fetch("/usuario/atualizar-usuario",
            { 
                method: "POST", // método HTTP POST para atualização
                headers: {
                    "Content-Type": "application/json", // define envio em JSON
                },
                body: JSON.stringify({
                    fkUsuarioServer: fkUsuario, // envia id do usuário
                    nomeServer: nomeVar, // envia nome atualizado
                    dtNascServer: nascimentoVar, // envia data formatada
                    emailServer: emailVar, // envia email
                    senhaServer: senhaVar // envia senha
                }),
            })
                // trata resposta do backend
                .then(function (resposta)
                {
                    console.log("resposta: ", resposta);

                    if (resposta.ok)
                    {
                        alert("Dados alterados com sucesso!"); // mensagem de sucesso

                        // redireciona após 1s
                        setTimeout(() => {
                            window.location = "inicio.html";
                        }, 1000);
                    }
                    
                    else
                    {
                        throw alert("Houve um erro ao tentar alterar seus dados!");
                    }
                })
                .catch(function (resposta)
                {
                    // erro caso backend falhe
                    alert(`#ERRO: ${resposta}`);
                });

            return false;
        }
    }

    function visualizarPreferencias() 
    {
        // busca preferências do usuário e preenche inputs

        // id do usuário logado
        var fkUsuario = sessionStorage.ID_USUARIO;

        // requisição GET para buscar preferências

        // Faz a requisição
        // quando o servidor responder
        // verifica se deu ok
        // converte o JSON
        // usa os dados
        // Se qualquer coisa der errado no caminho
        // cai no catch
        fetch(`/preferencia/visualizar-preferencias/${fkUsuario}`)

        // trata resposta do backend
        .then(function (resposta)
        {
            if (resposta.ok)
            {
                // trata resposta do backend
                resposta.json().then(function (dados)
                {
                    document.getElementById("ipt_genero_musical").value = dados[0].genero_musical;
                    document.getElementById("ipt_objetivo_pilates").value = dados[0].objetivo_pilates;
                    document.getElementById("ipt_tempo_treino").value = dados[0].tempo_treino;
                });
            }
        });
    }

    function atualizarPreferencias()
    {
        var generoMusicalVar = ipt_genero_musical.value;
        var objetivoPilatesVar = ipt_objetivo_pilates.value;
        var dataBruta = ipt_tempo_treino.value;

        var dia = dataBruta[0] + dataBruta[1]; // extrai o dia da string
        var mes = dataBruta[3] + dataBruta[4]; // extrai o mes da string
        var ano = dataBruta[6] + dataBruta[7] + dataBruta[8] + dataBruta[9] // extrai o ano da string

        // reorganiza a data para formato AAAA-MM-DD (como deve ser pra inserir uma data no mysql)
        var tempoTreinoVar = ano + `-` + mes + `-` + dia;

        var fkUsuario = sessionStorage.ID_USUARIO;

        if (generoMusicalVar == '')
        {
            alert("Selecione um gênero musical");
            return false;
        }

        else if (objetivoPilatesVar == '')
        {
            alert("Selecione um objetivo");
            return false;
        }

        else if (!dataBruta.includes('/'))
        {
            alert(`Certifique-se que sua data está seguindo esse formato: DD/MM/AAAA`);
            return false;
        }

        else
        {
            // envia atualização para backend

            // Faz a requisição
            // quando o servidor responder
            // verifica se deu ok
            // converte o conteúdo
            // usa os dados
            // se qualquer coisa der errado no caminho -> cai no catch
            fetch("/preferencia/atualizar-preferencias/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json", // define envio JSON
                },
                body: JSON.stringify({
                    fkUsuarioServer: fkUsuario,
                    objetivoPilatesServer: objetivoPilatesVar,
                    tempoTreinoServer: tempoTreinoVar,
                    generoMusicalServer: generoMusicalVar
                }),
            })
                .then(function (resposta)
                {
                    console.log("resposta: ", resposta);

                    if (resposta.ok)
                    {
                        alert("Preferências atualizadas com sucesso!")

                        // redireciona após 1s
                        setTimeout(() => {
                            window.location = "inicio.html";
                        }, 1000);
                    }
                    
                    else
                    {
                        throw alert("Houve um erro ao tentar alterar seus dados!");
                    }
                })
                .catch(function (resposta)
                {
                    alert(`#ERRO: ${resposta}`);
                });

            return false;
        }
    }

</script>
