<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilates - Página de Cadastro</title>
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body onload="vizualizar()">

    <header class="">

        <p><a href="inicio.html">← Voltar</a></p>
        

    </header>

    <div class="form">

        <h1>Editar Perfik</h1>

        <div class="campo">
            <p>Nome Completo:</p>
            <input type="text" id="ipt_nome_user" placeholder="Digite seu nome">
        </div>
        
        <div class="campo">
            <p>Data de Nascimento (AAAA/MM/DD):</p>
            <input type="text" id="ipt_nascimento_user" placeholder="Digite sua data de nascimento">
        </div>

        <div class="campo">
            <p>Email:</p>
            <input type="email" id="ipt_email_user" placeholder="Digite seu email">
        </div>

        <div class="campo">
            <p>Senha:</p>
            <input type="password" id="ipt_senha_user" placeholder="Digite sua senha">
        </div>

        <div class="campo"> 
            <p>Confirme a senha:</p>
            <input type="password" id="ipt_conf_senha_user" placeholder="Digite sua senha novamente">
        </div>

        <div class="campo">
            <button onclick="atualizar()">Cadastrar</button>
        </div>

        <p>Já possui conta? <a href="login.html">Entre aqui!</a></p>

        <div class="erro" id="cardErro" style="display: none; color: red; margin-top: 10px;">
            <p id="mensagem_erro"></p>
        </div>

    </div>

    <footer>

        <div class="titulo">Copyright © 2026 Pedro Costa Pereira - Todos os direitos reservados | <a href="http://www.linkedin.com/in/pedrocosta6/">Open Linkedln</a></div>

    </footer>
    
</body>
</html>

<script>

    function vizualizar()
    {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/usuario/vizualizar/${fkUsuario}`)
        .then(function (resposta)
        {
            if (resposta.ok)
            {
                resposta.json().then(function (dados)
                {
                    document.getElementById("ipt_nome_user").innerHTML = dados[0].nome_usuario;
                    document.getElementById("ipt_nascimento_user").innerHTML = dados[0].dt_nasc_usuario;
                    document.getElementById("ipt_email_user").innerHTML = dados[0].email_usuario;
                    document.getElementById("ipt_senha_user").innerHTML = dados[0].senha_usuario;
                });
            }
        });
    }

</script>
