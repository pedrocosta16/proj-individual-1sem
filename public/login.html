<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilates - Entrar</title>

    <script src="js/sessao.js"></script>

    <link rel="icon" href="assets/icons/icone.png">
    <link rel="stylesheet" href="css/institucional.css">
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body>

    <header>

        <div class="titulo"><a href="index.html">PILATES</a></div>

        <div class="header-pags">
            <a href="#secao-2">Sobre Pilates</a>
            <a href="minha-historia.html">Minha História</a>
        </div>

        <div class="header-botao">
            <a href="login.html">Login/Cadastro</a>
        </div>

    </header>

    <div class="form">

        <h1>Entre em sua conta</h1>

        <div class="campo">
            <p>Email:</p>
            <input type="email" id="ipt_email_user" placeholder="Digite seu email">
        </div>

        <div class="campo">
            <p>Senha:</p>
            <div id="div_olho" class="div_olho">
                <input type="password" id="ipt_senha_user" placeholder="Digite sua senha">
                <img id="olho" onclick="verSenha()" class="olho-visivel" src="assets/icons/not-visible.png" alt="">
            </div>
        </div>

        <div class="campo">
            <button onclick="entrar()">Entrar</button>
        </div>

        <p>Não possui conta? <a href="cadastro.html">Cadastre-se aqui!</a></p>

        <div id="div_aguardar" class="loading-div">
            <img src="assets/icons/circle-loading.gif" id="loading-gif">
        </div>

    </div>

    <footer>

        <div class="titulo">2026 - Pedro Costa Pereira | <a href="http://www.linkedin.com/in/pedrocosta6/">Open Linkedln</a></div>

    </footer>
    
</body>
</html>


<script>

    function entrar()
    {
        // função que realiza o login do usuário

        var emailVar = ipt_email_user.value; // captura email digitado no input
        var senhaVar = ipt_senha_user.value; // captura senha digitada no input

        // valida se algum campo está vazio
        if (emailVar == "" || senhaVar == "")
        {
            alert(`Verifique campos em branco`)
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        document.getElementById("div_aguardar").style.display = "block";

        // Faz a requisição
        // quando o servidor responder
        // verifica se deu ok
        // converte o conteúdo
        // usa os dados
        // se qualquer coisa der errado no caminho -> cai no catch
        fetch("/usuario/autenticar-usuario",
        {
            method: "POST", // define método HTTP como POST para envio de dados
            headers: {
                "Content-Type": "application/json" // informa que o corpo da requisição está em JSON
            },
            body: JSON.stringify({
                // converte os dados JS para JSON para envio ao backend

                emailServer: emailVar, // envia email
                senhaServer: senhaVar // envia senha
            })
        }).then(function (resposta)
        {
            // trata resposta do backend após login

            console.log("ESTOU NO THEN DO entrar()!")

            // login autorizado
            if (resposta.ok)
            {
                console.log(resposta);

                resposta.json().then(json => {
                    // converte resposta em JSON
                    console.log(json);
                    console.log(JSON.stringify(json));

                    sessionStorage.EMAIL_USUARIO = json.email; // armazena email na sessão
                    sessionStorage.NOME_USUARIO = json.nome; // armazena nome na sessão
                    sessionStorage.ID_USUARIO = json.id; // armazena id na sessão
                    sessionStorage.OBJETIVO_USUARIO = json.objetivo; // armazena objetivo na sessão
                    sessionStorage.GENERO_USUARIO = json.genero; // armazena genero na sessão

                    // redireciona para página inicial após login
                    setTimeout(function ()
                    {
                        window.location = "inicio.html";
                        alert(`Seja bem vindo(a), ${sessionStorage.NOME_USUARIO}`)
                    }, 1000); // apenas para exibir o loading

                    console.log("SALVEI:", sessionStorage);
                });

            }
            
            else
            {
                // caso login falhe
                resposta.text().then(texto => {
                    // Esconde o loading se der erro
                    document.getElementById("div_aguardar").style.display = "none";

                    console.error(texto);
                });
            }

        }).catch(function (erro)
        {
            // Esconde o loading se cair no catch
            document.getElementById("div_aguardar").style.display = "none";

            // erro na requisição
            console.log(erro);
        })

        return false;
    }

</script>
