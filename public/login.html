<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilates - Página de Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header>

        <div class="titulo"><a href="index.html">PILATES</a></div>

        <ul class="header-pags">
            <li><a href="#secao-2">Sobre Pilates</a></li>
            <li><a href="#">Minha História</a></li>
        </ul>

        <div class="header-botao">
            <button><a href="login.html">Login/Cadastro</a></button>
        </div>

    </header>

    <div class="login">

        <h1>Entre em sua conta</h1>

        <input type="email" id="ipt_email_user" placeholder="EMAIL">

        <input type="password" id="ipt_senha_user" placeholder="SENHA">

        <div class="login-botao">
            <button onclick="entrar()">Entrar</button>
        </div>

        <p>Não possui conta? <a href="cadastro.html">Cadastre-se aqui!</a></p>

        <div class="erro" id="div_erros_login"></div>

    </div>

    <footer>

        <div class="titulo">Copyright © 2026 Pedro Costa Pereira - Todos os direitos reservados | <a href="http://www.linkedin.com/in/pedrocosta6/">Open Linkedln</a></div>

    </footer>
    
</body>
</html>


<script>

    function entrar() {
        //aguardar();

        var emailVar = ipt_email_user.value;
        var senhaVar = ipt_senha_user.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            //finalizarAguardar();
            return false;
        }
        else {
            setInterval(5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuario/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    //finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    /*function sumirMensagem() {
        cardErro.style.display = "none"
    }*/

</script>
