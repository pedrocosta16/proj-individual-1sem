<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilates - Página Inicial</title>

    <link rel="stylesheet" href="css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body onload="validarSessao(), vizualizarPreferencias(), vizualizarQuizzes()">

    <div class="inicio">

        <div class="inicio-topo">
            <div class="inicio-topo-info">
                <h1>Olá, <span id="b_usuario"></span>!</h1>
                <p id="b_email"></p>
            </div>
            <div class="inicio-topo-acoes">
                <button class="btn-perfil">Editar perfil</button>
                <button class="btn-dashboard"><a href="dashboard.html">Dashboard</a></button>
                <!-- <img onclick="limparSessao()" src="assets/icons/logout.png" alt="Sair da Conta" title="Sair da conta"> -->
                
                <button class="btn-perfil" onclick="limparSessao()" title="Sair da conta">
                    <img src="assets/icons/logout.png" alt="Descrição do ícone">
                    
                </button>

            </div>
        </div>

        <!-- sem preferências -->
        <div class="pref-vazio" id="pref-vazio">
            <p>Preencha suas preferências para personalizarmos sua experiência.</p>
            <a href="preferencias.html">
                <button class="btn-preencher">Preencher agora</button>
            </a>
        </div>

        <!-- com preferências -->
        <div class="pref escondido" id="pref">
            <div>
                <h1>Suas preferências:</h1>
            </div>

            <div class="pref-cards">
                <div class="pref-item">
                    <div class="pref-label">GÊNERO MUSICAL</div>
                    <div class="pref-valor" id="val-genero">-</div>
                </div>

                <div class="pref-item">
                    <div class="pref-label">OBJETIVO COM O PILATES</div>
                    <div class="pref-valor" id="val-objetivo">-</div>
                </div>
                
                <div class="pref-item">
                    <div class="pref-label">TEMPO DE TREINO</div>
                    <div class="pref-valor" id="val-tempo">-</div>
                </div>
            </div>
        </div>

        <div class="quiz escondido" id="quiz">
            <div>
                <h1>Suas tentativas no quiz:</h1>
            </div>

            <div class="cards-quiz" id="cards-quiz">
                <!-- CARDS DAS TENTATIVAS DO QUIZ AQUI -->
            </div>
        </div>

    </div>

</body>
</html>

<script>

    function validarSessao()
    {
        console.log("SESSION INICIO:", sessionStorage);

        var email = sessionStorage.EMAIL_USUARIO;
        var nome = sessionStorage.NOME_USUARIO;

        var b_usuario = document.getElementById("b_usuario");
        var b_email = document.getElementById("b_email");

        if (email != null && nome != null)
        {
            b_usuario.innerHTML = nome;
            b_email.innerHTML = email;
        }
        
        else
        {
            window.location = "login.html";
        }
    }

    function vizualizarPreferencias()
    {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/preferencia/visualizar/${fkUsuario}`)
        .then(function (resposta)
        {
            if (resposta.ok)
            {
                resposta.json().then(function (dados)
                {
                    document.getElementById("val-genero").innerHTML = dados[0].genero_musical;
                    document.getElementById("val-objetivo").innerHTML = dados[0].objetivo_pilates;
                    document.getElementById("val-tempo").innerHTML = dados[0].tempo_treino;
                    
                    document.getElementById("pref").classList.remove("escondido");
                    
                    document.getElementById('pref-vazio').classList.add('escondido');
                });
            }
        });
    }

    function vizualizarQuizzes()
    {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/quiz/vizualizar-quizzes/${fkUsuario}`)
        .then(function (resposta)
        {

            if (resposta.ok)
            {
                

                resposta.json().then(function (dados)
                {
                    for (let i = 0; i < dados.length; i++)
                    {
                        console.log(dados);

                        let card = `
                            <div class="quiz-item">
                                <div class="quiz-label" id="val-dt-quiz">Tentativa ${i + 1} - ${dados[i].data_quiz}</div>
                                <div class="quiz-valor" id="val-pontuacao">${dados[i].pontuacao_quiz} pts</div>
                            </div>
                        `;
                        
                        document.getElementById("quiz").classList.remove("escondido");
                        document.getElementById("cards-quiz").innerHTML += card

                    }
                });
            }
        });
    }

    function limparSessao()
    {
        sessionStorage.clear();
        window.location = "index.html";
    }

</script>
